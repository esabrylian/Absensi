<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absensi Karyawan</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1a2233;--mut:#6b7587;--pri:#1d4ed8;--ok:#15803d;--bd:#dde3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#18202f;--tx:#e8edf7;--mut:#93a0b8;--pri:#5b8cff;--ok:#4ade80;--bd:#2a3550}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#18202f;--tx:#e8edf7;--mut:#93a0b8;--pri:#5b8cff;--ok:#4ade80;--bd:#2a3550}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:480px;margin:0 auto;padding:16px}
.hero{text-align:center;padding:28px 12px 18px}
.logo{width:64px;height:64px;border-radius:16px;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:700;margin:0 auto 12px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);font-size:14px}
.clock{font-size:34px;font-weight:700;margin-top:10px;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:13px 16px;font-weight:600;background:var(--pri);color:#fff;width:100%;margin-top:10px}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.seg{display:flex;gap:8px}.seg button{margin:0;background:transparent;color:var(--tx);border:1px solid var(--bd)}
.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
video,.prev{width:100%;border-radius:12px;background:#000;display:block;aspect-ratio:3/4;object-fit:cover}
.prev{height:auto;aspect-ratio:auto}
.hide{display:none!important}
.rec{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.rec:first-child{border-top:0}
.rec img{width:56px;height:56px;border-radius:10px;object-fit:cover}
.rec b{display:block}.rec small{color:var(--mut)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--pri);color:#fff;margin-left:6px}
.tag.out{background:var(--ok)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
#toast.show{opacity:1}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.top button{width:auto;margin:0;padding:8px 12px}
</style>
</head>
<body>
<div class="app">

<div class="hero" id="hero">
    <div class="logo" id="logo">P</div>
    <h1 id="co">PT Nama Perusahaan</h1>
    <div class="sub">Aplikasi Absensi Karyawan</div>
    <div class="clock" id="clock"></div>
    <div class="sub" id="date"></div>
</div>

<section id="v-login" class="hide">
  <div class="card">
    <label>Username</label><input id="lu" autocomplete="username" autocapitalize="none">
    <label>Password</label><input id="lp" type="password" autocomplete="current-password">
    <button id="lbtn">Masuk</button>
    <button class="sec" id="adm">Pengaturan Admin</button>
    <div class="sub" id="lmsg" style="margin-top:8px"></div>
  </div>
</section>

<section id="v-home" class="hide">
  <div class="card">
    <div class="sub">Halo,</div><h1 id="hello" style="margin-bottom:6px"></h1>
    <label>Jenis absen</label>
    <div class="seg"><button id="tIn" class="on">Masuk</button><button id="tOut">Pulang</button></div>
    <button id="go">Mulai Absen</button>
    <button class="sec" id="hist">Riwayat Absen</button>
    <button class="sec hide" id="set">Pengaturan</button>
    <button class="sec" id="logout">Keluar</button>
  </div>
</section>

<section id="v-scan" class="hide">
  <div class="top"><b>1. Scan Barcode</b><button class="sec" data-back>Batal</button></div>
  <div class="card">
    <video id="vs" playsinline muted></video>
    <div class="sub" style="margin-top:8px" id="scanmsg">Arahkan kamera ke barcode/QR lokasi absen.</div>
    <label>Atau ketik kode manual</label><input id="manual" placeholder="Kode absen">
    <button class="sec" id="mbtn">Verifikasi Kode</button>
  </div>
</section>

<section id="v-selfie" class="hide">
  <div class="top"><b>2. Foto Selfie</b><button class="sec" data-back>Batal</button></div>
  <div class="card">
    <video id="vf" playsinline muted></video>
    <img id="pv" class="prev hide" alt="Hasil selfie">
    <button id="snap">Ambil Foto</button>
    <button id="save" class="hide">Kirim Absen</button>
    <button id="retake" class="sec hide">Ulangi</button>
    <label class="hide" id="alt">Kamera tidak tersedia? Pilih foto:</label>
    <input type="file" id="file" accept="image/*" capture="user" class="hide">
  </div>
</section>

<section id="v-hist" class="hide">
  <div class="top"><b>Riwayat Absen</b><button class="sec" data-back>Kembali</button></div>
  <div class="card" id="list"></div>
</section>

<section id="v-set" class="hide">
  <div class="top"><b>Pengaturan</b><button class="sec" data-back>Kembali</button></div>
  <div class="card">
    <label>Nama PT / Perusahaan</label><input id="cName">
    <label>Isi kode barcode yang valid</label><input id="cCode">
    <div class="sub" style="margin-top:6px">Buat QR/barcode berisi teks kode ini (mis. lewat generator QR), lalu cetak dan tempel di lokasi absen.</div>
    <label>Lokasi kantor (lat, lng) dan radius meter (0 = nonaktif)</label>
    <input id="cLat" placeholder="Latitude" inputmode="decimal"><input id="cLng" placeholder="Longitude" inputmode="decimal" style="margin-top:6px"><input id="cRad" placeholder="Radius meter, mis. 100" inputmode="numeric" style="margin-top:6px">
    <button class="sec" id="cGeo">Pakai lokasi saya sekarang</button>
    <label>URL backend (Google Apps Script)</label><input id="cUrl" placeholder="https://script.google.com/macros/s/.../exec">
    <button id="cSave">Simpan</button>
  </div>
</section>

</div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const ls={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const DEFAULT_CFG={company:'PT Putra Septia Mandiri',code:'PT-PUTRA-SEPTIA',url:'https://script.google.com/macros/s/AKfycbz4vTNbcu_eC6iJL4q7th_1sQSiheosS2LVPArTBbnET2OWUTWOfz1XVHa4iSY6kEZe/exec',lat:0,lng:0,radius:0}; // isi sebelum diunggah
let cfg=Object.assign({},DEFAULT_CFG,ls.get('cfg',{}));
let sess=ls.get('sess',null);const user={get name(){return sess?sess.name:''}};
let recs=ls.get('recs',[]);
let type='Masuk',stream=null,raf=null,shot=null,view='home';
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function show(id){stopCam();view=id;$('#hero').classList.toggle('hide',!['login','home'].includes(id));document.querySelectorAll('section').forEach(s=>s.classList.add('hide'));$('#v-'+id).classList.remove('hide');window.scrollTo(0,0)}
function applyCfg(){$('#co').textContent=cfg.company;$('#logo').textContent=(cfg.company.replace(/^PT\.?\s*/i,'')[0]||'P').toUpperCase();document.title=cfg.company+' - Absensi'}
function tick(){const d=new Date();$('#clock').textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;$('#date').textContent=d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
setInterval(tick,1000);tick();applyCfg();


async function startCam(video,facing){
  stopCam();
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});
    video.srcObject=stream;await video.play();return true;
  }catch(e){toast('Kamera tidak bisa dibuka. Izinkan akses kamera.');return false}
}
function stopCam(){cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}

$('#tIn').onclick=()=>{type='Masuk';$('#tIn').classList.add('on');$('#tOut').classList.remove('on')};
$('#tOut').onclick=()=>{type='Pulang';$('#tOut').classList.add('on');$('#tIn').classList.remove('on')};
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>show(sess?'home':'login'));
function openSet(){$('#cName').value=cfg.company;$('#cCode').value=cfg.code;$('#cUrl').value=cfg.url||'';$('#cLat').value=cfg.lat||'';$('#cLng').value=cfg.lng||'';$('#cRad').value=cfg.radius||'';show('set')}
$('#set').onclick=openSet;
$('#cSave').onclick=()=>{const n=$('#cName').value.trim(),c=$('#cCode').value.trim();if(!n||!c)return toast('Isi semua kolom');cfg={company:n,code:c,url:$('#cUrl').value.trim(),lat:parseFloat($('#cLat').value)||0,lng:parseFloat($('#cLng').value)||0,radius:parseInt($('#cRad').value)||0};ls.set('cfg',cfg);applyCfg();toast('Tersimpan');show(sess?'home':'login')};

$('#go').onclick=async()=>{
  show('scan');
  if(await startCam($('#vs'),'environment'))scanLoop();
};
let det=null;try{if('BarcodeDetector' in window)det=new BarcodeDetector()}catch(e){}
const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
function scanLoop(){
  const v=$('#vs');
  const step=async()=>{
    if(view!=='scan'||!stream)return;
    if(v.readyState>=2&&v.videoWidth){
      let val=null;
      try{
        if(det){const r=await det.detect(v);if(r.length)val=r[0].rawValue}
        else if(window.jsQR){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);const im=cx.getImageData(0,0,cv.width,cv.height);const r=jsQR(im.data,im.width,im.height);if(r)val=r.data}
      }catch(e){}
      if(val&&verify(val))return;
    }
    raf=requestAnimationFrame(step);
  };
  step();
}
function verify(val){
  if(val.trim()===cfg.code){toast('Barcode valid ✓');gate();return true}
  $('#scanmsg').textContent='Kode tidak sesuai: '+val.slice(0,30);return false;
}
$('#mbtn').onclick=()=>{const v=$('#manual').value;if(!verify(v))toast('Kode salah')};

async function toSelfie(){
  show('selfie');shot=null;
  $('#vf').classList.remove('hide');$('#pv').classList.add('hide');
  $('#snap').classList.remove('hide');$('#save').classList.add('hide');$('#retake').classList.add('hide');
  const ok=await startCam($('#vf'),'user');
  $('#file').classList.toggle('hide',ok);$('#alt').classList.toggle('hide',ok);
}
function stamp(src,w,h){
  const c=document.createElement('canvas');const sc=Math.min(1,640/w);c.width=Math.round(w*sc);c.height=Math.round(h*sc);
  const g=c.getContext('2d');g.drawImage(src,0,0,c.width,c.height);
  const now=new Date(),fs=Math.max(14,Math.round(c.width/26)),bh=fs*4.4;
  g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,c.height-bh,c.width,bh);
  g.fillStyle='#fff';g.font=`bold ${fs}px sans-serif`;g.textBaseline='top';
  g.fillText(cfg.company,12,c.height-bh+fs*.4);
  g.font=`${fs}px sans-serif`;
  g.fillText(`${user.name} - ${type}`,12,c.height-bh+fs*1.6);
  g.fillText(fmt(now),12,c.height-bh+fs*2.8);
  return {data:c.toDataURL('image/jpeg',.7),ts:now.toISOString()};
}
function setShot(s){shot=s;$('#pv').src=s.data;$('#pv').classList.remove('hide');$('#vf').classList.add('hide');$('#snap').classList.add('hide');$('#save').classList.remove('hide');$('#retake').classList.remove('hide');stopCam()}
$('#snap').onclick=()=>{const v=$('#vf');if(!v.videoWidth)return toast('Kamera belum siap');setShot(stamp(v,v.videoWidth,v.videoHeight))};
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>setShot(stamp(im,im.width,im.height));im.src=URL.createObjectURL(f)};
$('#retake').onclick=toSelfie;
$('#save').onclick=()=>{
  recs.unshift({ts:shot.ts,type,name:user.name,u:sess.u,lat:geo?geo.lat:null,lng:geo?geo.lng:null,img:shot.data});
  if(recs.length>60)recs.length=60;
  if(!ls.set('recs',recs))toast('Penyimpanan penuh, riwayat lama dihapus');
  toast('Absen '+type+' tersimpan ✓');show('home');flush();
};
async function api(b){const x=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b)});return await x.json()}
async function send(r){
  if(!cfg.url||!sess||r.u!==sess.u)return false;
  try{const d=await api({action:'absen',u:r.u,sig:sess.sig,ts:r.ts,type:r.type,lat:r.lat,lng:r.lng,img:r.img});
    if(d.ok){r.sent=true;return true}
    if(/area/.test(d.msg||'')){r.rej=1;toast(d.msg)}
    if(d.msg==='auth'){toast('Sesi habis, silakan login ulang');sess=null;ls.set('sess',null);show('login')}
  }catch(e){}
  return false;
}
async function flush(){let ch=false;for(const r of recs.slice().reverse()){if(!r.sent&&!r.rej&&await send(r))ch=true}if(ch)ls.set('recs',recs)}
addEventListener('online',flush);flush();
$('#hist').onclick=()=>{
  const l=$('#list');
  l.innerHTML=recs.some(x=>x.u===sess.u)?'':'<div class="sub">Belum ada riwayat.</div>';
  recs.filter(x=>x.u===sess.u).forEach(r=>{
    const d=document.createElement('div');d.className='rec';
    const im=document.createElement('img');im.src=r.img;im.alt='';
    const t=document.createElement('div');
    t.innerHTML='<b></b><small></small>';
    t.querySelector('b').textContent=r.name;
    const tg=document.createElement('span');tg.className='tag'+(r.type==='Pulang'?' out':'');tg.textContent=r.type;t.querySelector('b').appendChild(tg);
    t.querySelector('small').textContent=fmt(new Date(r.ts))+(r.sent?' · terkirim':r.rej?' · ditolak (di luar area)':' · belum terkirim');
    d.append(im,t);l.appendChild(d);
  });
  show('hist');
};
let geo=null;
function getGeo(){return new Promise(res=>{if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),()=>res(null),{enableHighAccuracy:true,timeout:15000,maximumAge:0})})}
function dist(a,b,c,d){const t=x=>x*Math.PI/180,h=Math.sin(t(c-a)/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(t(d-b)/2)**2;return Math.round(12742000*Math.asin(Math.sqrt(h)))}
async function gate(){
  stopCam();toast('Memeriksa lokasi...');
  geo=await getGeo();
  if(cfg.radius>0){
    if(!geo){toast('Lokasi tidak terdeteksi. Aktifkan GPS dan izinkan lokasi.');return show('home')}
    const m=dist(cfg.lat,cfg.lng,geo.lat,geo.lng);
    if(m>cfg.radius){toast('Di luar area absen ('+m+' m dari lokasi)');return show('home')}
  }
  toSelfie();
}
$('#cGeo').onclick=async()=>{const g=await getGeo();if(!g)return toast('Lokasi tidak terdeteksi');$('#cLat').value=g.lat.toFixed(6);$('#cLng').value=g.lng.toFixed(6);toast('Lokasi terisi')};
let wantSet=false;
function enter(){$('#hello').textContent=sess.name;$('#set').classList.toggle('hide',sess.role!=='admin');show('home')}
$('#adm').onclick=()=>{if(!cfg.url)return openSet();wantSet=true;$('#lmsg').textContent='Login sebagai admin untuk membuka pengaturan.'};
$('#lbtn').onclick=async()=>{
  const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value;
  if(!cfg.url)return $('#lmsg').textContent='URL backend belum diatur. Hubungi admin.';
  if(!u||!p)return toast('Isi username dan password');
  $('#lmsg').textContent='Memeriksa...';
  try{
    const d=await api({action:'login',u,p});
    if(!d.ok){wantSet=false;$('#lmsg').textContent=d.msg||'Login gagal';return}
    if(wantSet){wantSet=false;if(d.role!=='admin'){$('#lmsg').textContent='Hanya admin yang boleh membuka pengaturan.';return}
      sess=d;ls.set('sess',sess);$('#lp').value='';$('#lmsg').textContent='';enter();openSet();return}
    sess=d;ls.set('sess',sess);$('#lp').value='';$('#lmsg').textContent='';enter();flush();
  }catch(e){$('#lmsg').textContent='Tidak bisa terhubung ke server'}
};
$('#logout').onclick=()=>{sess=null;ls.set('sess',null);$('#lmsg').textContent='';show('login')};
sess?enter():show('login');
</script>
</body>
</html>
